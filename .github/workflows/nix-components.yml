name: nix-components

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v15
        with:
          name: dynamicderivations
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build .#nix-incremental .#nix-all-components -L
